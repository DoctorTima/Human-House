<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100E0C">
<title>Схема привязки — Human House</title>
<link rel="stylesheet" href="./vendor/fonts/hh-fonts.css">
<style>
:root{
  --bg:#F3F0E9;--card:#FFFFFF;--soft:#F8F6F1;--ink:#1B1815;--ink2:#46413A;--mute:#6B655B;--line:#DCD5C9;--line2:#C9C1B3;
  --acc:#BF512D;--acc-h:#A43E22;--acc-bg:#FBEDE6;--ok:#2F6B45;--ok-bg:#E8F1EA;--warn:#8A5300;--warn-bg:#FBF1DC;--err:#B3261E;--err-bg:#FBE9E7;
  --top:#100E0C;--top-ink:#F5F1EB;--top-mute:#BFB1A0;
  --sans:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:10px;--rl:14px;--panel:400px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* каркас */
#app{height:100%;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);overflow:hidden;overflow:clip}
.top>*,.steps,.work{min-width:0}
.top{background:var(--top);color:var(--top-ink);display:flex;align-items:center;gap:12px;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));min-height:60px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img{width:34px;height:34px;object-fit:contain;flex:none}
.brand b{display:block;font-size:17px;font-weight:800;line-height:1.15;white-space:nowrap}
.brand b span{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--top-ink);background:var(--acc);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.brand small{display:block;font-size:12.5px;color:var(--top-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{min-height:44px;min-width:44px;padding:0 14px;border-radius:var(--r);border:1px solid #3F3931;background:transparent;color:var(--top-ink);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tbtn:hover{background:#292520}
.tbtn:disabled{opacity:.35;cursor:default}
.tbtn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.tbtn.pri:hover{background:var(--acc-h)}
.tbtn svg{width:20px;height:20px}
.tools{display:flex;gap:6px;align-items:center}
.menu{position:absolute;right:12px;top:62px;z-index:60;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:var(--rl);box-shadow:0 14px 40px rgba(16,14,12,.22);padding:6px;min-width:260px;display:flex;flex-direction:column}
.menu button{min-height:48px;text-align:left;border:0;background:none;border-radius:8px;padding:0 14px;font-size:15.5px;font-weight:500}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* шаги */
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px max(12px,env(safe-area-inset-left));background:#1B1815;border-top:1px solid #292520}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px 0 8px;border-radius:999px;border:1px solid #3F3931;background:transparent;color:var(--top-mute);font-size:15px;font-weight:600;white-space:nowrap}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:600;background:#292520;color:var(--top-ink)}
.step.done i{background:var(--ok);color:#fff}
.step.bad i{background:var(--err);color:#fff}
.step[aria-current=step]{background:var(--top-ink);color:var(--top);border-color:var(--top-ink)}
.step[aria-current=step] i{background:var(--acc);color:#fff}

/* рабочая зона */
.work{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--panel)}
.stage{position:relative;min-height:0;min-width:0;overflow:hidden;background:#FAF9F4;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0}
#cv svg{display:block}
.side{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--line)}
.grab,.mhint,.m-only{display:none}
.panel>*{flex-shrink:0}
.panel{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 18px 28px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}

/* оверлеи на схеме */
.ov{position:absolute;z-index:5}
.zoom{right:12px;top:12px;display:flex;flex-direction:column;gap:8px}
.zbtn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.96);color:var(--ink);font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(16,14,12,.10)}
.zbtn:hover{background:#fff}
.zbtn small{font-size:12px;font-weight:700}
.badges{left:12px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;max-width:calc(100% - 90px)}
.badge{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 14px 6px 10px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.97);box-shadow:0 2px 8px rgba(16,14,12,.10);text-align:left}
.badge .ic{flex:none;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--acc);color:#fff}
.badge .ic svg{width:20px;height:20px}
.badge b{display:block;font-size:17px;font-weight:800;line-height:1.15}
.badge span{display:block;font-size:13px;color:var(--mute);line-height:1.3}
.badge.empty .ic{background:var(--warn-bg);color:var(--warn)}
.badge.empty b{font-size:15px;color:var(--warn)}
.hint{left:50%;bottom:14px;transform:translateX(-50%);max-width:min(640px,calc(100% - 24px));padding:12px 18px;border-radius:14px;background:var(--top);color:var(--top-ink);font-size:16px;font-weight:600;line-height:1.35;text-align:center;box-shadow:0 8px 24px rgba(16,14,12,.25);pointer-events:none}
.hint em{font-style:normal;color:#F3BFA2}
.toast{left:50%;bottom:86px;transform:translateX(-50%);z-index:8;pointer-events:none;font-size:15px;padding:10px 16px;border-radius:12px;background:var(--ok);color:#fff;font-weight:600;box-shadow:0 8px 24px rgba(16,14,12,.2);max-width:calc(100% - 140px);text-align:center}
.toast.bad{background:var(--err)}

/* редактор числа (поповер) */
.pop{left:50%;bottom:12px;transform:translateX(-50%);width:min(440px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(16,14,12,.30);padding:16px;display:flex;flex-direction:column;gap:12px;z-index:20}
.pop h3{margin:0;font-size:17px;font-weight:800;line-height:1.25;padding-right:44px}
.pop .x{position:absolute;z-index:2;right:10px;top:10px;width:44px;height:44px;border:0;background:none;font-size:26px;line-height:1;color:var(--mute);border-radius:10px}
.pop .row{display:flex;gap:10px;align-items:stretch}
.pop input{flex:1;min-width:0;height:60px;border:2px solid var(--acc);border-radius:12px;padding:0 14px;font-family:var(--mono);font-size:28px;font-weight:600;background:#fff}
.pop .unit{display:flex;align-items:center;font-size:18px;font-weight:700;color:var(--mute)}
.pop p{margin:0;font-size:14px;color:var(--mute)}

/* панель: элементы */
.ph{display:flex;align-items:flex-start;gap:12px}
.ph .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;font-family:var(--mono);font-weight:600;display:flex;align-items:center;justify-content:center}
.ph h2{margin:0;font-size:22px;font-weight:800;line-height:1.15}
.ph p{margin:3px 0 0;color:var(--mute);font-size:15px}
.card{border:1px solid var(--line);border-radius:var(--rl);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.card.soft{background:var(--soft)}
.card.ok{border-color:#B9D3C1;background:var(--ok-bg)}
.card.warn{border-color:#EBD3A6;background:var(--warn-bg)}
.card.err{border-color:#F0C3BE;background:var(--err-bg)}
.card h3{margin:0;font-size:16px;font-weight:800}
.lead{font-size:17px;font-weight:700;line-height:1.35;margin:0}
.muted{color:var(--mute);font-size:14px;margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:var(--ink2);min-width:0}
label.f input,label.f select,label.f textarea{width:100%;min-height:52px;border:1px solid var(--line2);border-radius:var(--r);padding:0 12px;background:#fff;font-size:17px;font-weight:500;color:var(--ink)}
label.f textarea{min-height:90px;padding:10px 12px;resize:vertical}
label.f input.num{font-family:var(--mono);font-size:19px}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-bg)}
.btn{min-height:52px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line2);background:#fff;color:var(--ink);font-size:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.2}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-h)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--acc);padding:0 6px;min-height:44px}
.btn.ghost:hover{background:var(--acc-bg)}
.btn.danger{color:var(--err);border-color:#E9B8B2}
.btn.sm{min-height:44px;font-size:15px;padding:0 14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;font-size:15px;font-weight:700;color:var(--ink2);padding:0 8px}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:14px;font-weight:600;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--rl);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);background:#fff}
.li:last-child{border-bottom:0}
.li.sel{background:var(--acc-bg)}
.li .main{flex:1;min-width:0;border:0;background:none;text-align:left;display:flex;align-items:center;gap:10px;min-height:48px;padding:0}
.li .tag{flex:none;min-width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.li .tag.acc{background:var(--acc)}
.li .t{flex:1;min-width:0;font-size:15.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.li .v{font-family:var(--mono);font-size:17px;font-weight:600;white-space:nowrap}
.ib{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--mute);font-size:20px;display:inline-flex;align-items:center;justify-content:center}
.ib:hover{color:var(--err);border-color:#E9B8B2}
.slots{display:flex;gap:8px}
.slot{flex:1;min-height:64px;border-radius:12px;border:2px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;color:var(--mute);background:#fff}
.slot b{font-size:22px;line-height:1}
.slot small{font-size:12px;font-weight:600}
.slot.on{border-style:solid;border-color:var(--acc);background:var(--acc-bg);color:var(--acc)}
.how{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 12px;align-items:center}
.how i{font-style:normal;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--soft);border:2px solid var(--line2);color:var(--mute)}
.how i.now{background:var(--acc);border-color:var(--acc);color:#fff}
.how i.done{background:var(--ok);border-color:var(--ok);color:#fff}
.how span{font-size:16px;font-weight:600}
.big{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1;letter-spacing:-.02em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tile{min-height:88px;border-radius:12px;border:1px solid var(--line2);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 6px;font-size:13.5px;font-weight:700;line-height:1.2;text-align:center}
.tile svg{width:40px;height:28px}
.tile[aria-pressed=true]{border:2px solid var(--acc);background:var(--acc-bg)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-size:24px;font-weight:700}
.stepper output{min-width:48px;text-align:center;font-family:var(--mono);font-size:24px;font-weight:600}
details.more{border:1px solid var(--line);border-radius:var(--rl);background:var(--soft)}
details.more>summary{list-style:none;min-height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15.5px;font-weight:700;color:var(--ink2);cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"";width:9px;height:9px;border-right:2.5px solid var(--mute);border-bottom:2.5px solid var(--mute);transform:rotate(-45deg);transition:transform .15s}
details.more[open]>summary::before{transform:rotate(45deg)}
details.more>.in{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px}
.mini{width:100%;height:auto;max-height:220px;display:block;background:#FAF9F4;border-radius:12px;border:1px solid var(--line)}
.issues{display:flex;flex-direction:column;gap:8px}
.issue{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:14.5px;line-height:1.4}
.issue.err{background:var(--err-bg);color:#7A1A14}
.issue.warn{background:var(--warn-bg);color:#5E3A00}
.issue span{flex:1}
.issue button{flex:none;min-height:40px;border-radius:9px;border:1px solid currentColor;background:#fff;color:inherit;font-size:13.5px;font-weight:700;padding:0 10px}
.nav{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.nav .btn{flex:1}
.vt{width:100%;border-collapse:collapse;font-size:14px}
.vt td{padding:4px}
.vt input{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:8px;padding:0 8px;font-family:var(--mono);font-size:16px}

/* дом по точкам */
.seg.fit button{flex:1 1 auto;font-size:14px;padding:0 8px;white-space:nowrap}
.pwprev{width:100%;height:auto;display:block;background:#FAF9F4;border:1px solid var(--line);border-radius:12px;touch-action:manipulation}
.pwstat{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;font-size:14.5px;font-weight:600;line-height:1.35}
.pwstat.ok{background:var(--ok-bg);color:var(--ok)}.pwstat.warn{background:var(--warn-bg);color:var(--warn)}.pwstat.err{background:var(--err-bg);color:var(--err)}.pwstat.idle{background:var(--soft);color:var(--ink2)}
.pwstat .btn{min-height:40px;font-size:14.5px;padding:0 12px}
.pwadd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.pad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
.pad button{border:1px solid var(--line2);background:#fff;border-radius:11px;font-size:21px;font-weight:700;color:var(--ink);padding:0;touch-action:manipulation}
.pad button:active{background:var(--acc);border-color:var(--acc);color:#fff}
.pad button.c{font-size:13px;font-weight:700;color:var(--mute);background:var(--soft)}
.pwlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pwrow{display:grid;grid-template-columns:26px minmax(0,1fr) 98px 62px 40px;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);background:#fff}
.pwrow:last-child{border-bottom:0}
.pwrow.sel{background:var(--acc-bg)}
.pwrow b{font-family:var(--mono);font-size:14px;color:var(--acc);text-align:center}
.pwrow span{font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwrow input{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:9px;padding:0 8px;font-family:var(--mono);font-size:17px;text-align:right;background:#fff}
.pwrow select{width:100%;min-height:44px;border:1px solid var(--line2);border-radius:9px;font-size:20px;background:#fff;color:var(--ink);text-align:center;text-align-last:center;padding:0 2px}
.pwrow .ib{width:40px;height:40px}
.pwrow.w2{grid-template-columns:26px minmax(0,1fr) 110px 22px}.pwrow em{font-style:normal;color:var(--mute);font-weight:600}

/* подтверждение (вместо системного confirm — в холсте и встраиваниях он бывает заблокирован) */
.dlg{position:fixed;inset:0;z-index:120;background:rgba(16,14,12,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg .box{width:min(440px,100%);background:var(--card);border-radius:18px;box-shadow:0 24px 60px rgba(16,14,12,.35);padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:19px;font-weight:800;line-height:1.25}
.dlg p{margin:0;color:var(--mute);font-size:15px;line-height:1.45}
.dlg .btns{display:flex;flex-direction:column;gap:8px;margin-top:4px}.dlg .btn{width:100%}
.dlg .btn.danger{background:var(--err);border-color:var(--err);color:#fff}
@media (max-width:699px){.dlg{align-items:flex-end;padding:0}.dlg .box{border-radius:20px 20px 0 0;padding-bottom:max(20px,env(safe-area-inset-bottom))}}

/* узкие экраны: схема сверху, панель снизу */
@media (max-width:999px){
  .pop{position:fixed;left:0;right:0;bottom:0;transform:none;width:auto;border-radius:18px 18px 0 0;padding-bottom:max(16px,env(safe-area-inset-bottom));max-height:70vh;overflow-y:auto;z-index:40}
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(280px,58fr) minmax(0,42fr)}
  .hint{display:none}
  .toast{bottom:12px}
  .badge{min-height:40px;padding:4px 10px 4px 6px}.badge .ic{width:28px;height:28px}.badge span span{display:none}.badge b{font-size:15px}
  .zbtn{width:44px;height:44px}
  .side{border-left:0;border-top:1px solid var(--line)}
  .panel{padding:14px 14px 24px}
  .brand small{max-width:44vw}
}
@media (max-width:999px) and (max-height:560px) and (orientation:landscape){
  .work{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:none}
  .side{border-top:0;border-left:1px solid var(--line)}
  .top{min-height:48px;padding-top:4px;padding-bottom:4px}.brand img{width:26px;height:26px}.brand b{font-size:15px}.tbtn{min-height:40px}.menu{top:50px}
  .steps{padding:4px 10px;gap:4px}.step{min-height:38px;font-size:0;gap:0;padding:0 3px;border-color:transparent}.step i{width:30px;height:30px;font-size:13px}
  .step[aria-current=step]{font-size:14px;gap:8px;padding:0 12px 0 3px}
  .mhint:not([hidden]){display:block;flex:none;margin:10px 12px 0;padding:9px 12px;border-radius:12px;background:var(--top);color:var(--top-ink);font-size:14px;font-weight:600;line-height:1.35}

/* акт: просмотр и печать */
#print{position:fixed;inset:0;z-index:100;background:#E9E5DC;overflow:auto}
.pbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--top);color:var(--top-ink)}
.pbar p{margin:0;flex:1 1 260px;font-size:14px;color:var(--top-mute)}
/* лист A4 — акт в фирменном стиле Human House: поля как в бумажном бланке, Golos Text, тонкие линейки */
.sheet{--ink:#1D1C18;--mut:#6B675C;--hair:#E4E0D6;--tan:#8E7559;--soft:#F7F4EE;width:210mm;box-sizing:border-box;margin:16px auto;background:#fff;color:var(--ink);padding:13mm 15mm 8mm;box-shadow:0 6px 24px rgba(0,0,0,.18);font:9.5pt/1.42 'Golos Text',-apple-system,system-ui,'Segoe UI',Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* лист на экране: масштаб через transform внутри обёртки с точным размером — одинаково в Safari, Chrome, Firefox */
.sheetwrap{position:relative;margin:16px auto}
.sheetwrap>.sheet{position:absolute;left:0;top:0;margin:0;transform-origin:0 0}
.sheet p{margin:0}
.dh{display:flex;align-items:center;gap:4.5mm;padding-bottom:3mm;border-bottom:1.5px solid var(--ink)}

.stamp{display:inline-block;margin-top:1.5mm;border:1.5px solid #B3261E;color:#B3261E;font-weight:800;font-size:8pt;letter-spacing:.16em;padding:.7mm 2.4mm;border-radius:1mm}
.kick{margin:3.6mm 0 1mm;font-size:7.2pt;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--tan)}
.kick i{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;color:var(--mut);font-size:8.2pt;margin-left:1.5mm}
.rows{border-top:1px solid var(--hair)}
.row{display:grid;grid-template-columns:79mm minmax(0,1fr);gap:4mm;padding:1.15mm 0;border-bottom:1px solid var(--hair);align-items:baseline}
.row .l{color:var(--mut);font-size:8.4pt;line-height:1.3}
.row .v{font-weight:600;font-size:10pt}
.row .v small,.ut .v small{font-weight:400;color:var(--mut);font-size:8.4pt}
.blank{display:inline-block;min-width:40mm;border-bottom:1px solid #BDB7AA;height:1.05em;vertical-align:baseline}

.ut .n{color:var(--tan);font-weight:800}

.pill.yes{color:#2E6B47}.pill.planned{color:#9A5B12}.pill.no{color:#6B675C}
.note{margin-top:2.2mm;padding:1.5mm 3mm;background:var(--soft);border-left:2px solid var(--tan);border-radius:0 1.5mm 1.5mm 0;font-size:8.5pt;color:#3F3C35}
.ascheme{flex:1 1 auto;min-height:50mm;position:relative;border:1px solid var(--hair);border-radius:2.5mm;overflow:hidden}
.ascheme>svg{position:absolute;left:2mm;top:2mm;width:calc(100% - 4mm);height:calc(100% - 4mm)}
.cap{display:flex;justify-content:space-between;gap:4mm;margin-top:1.3mm;font-size:7.4pt;color:var(--mut)}
.notes{margin-top:2.2mm;font-size:9pt}
.notes b{color:var(--mut);font-weight:600}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:3.6mm}
.sg .l{font-size:8.2pt;color:var(--mut);min-height:1.3em;display:flex;align-items:flex-end;line-height:1.3}
.sg .ln,.sg .h{display:grid;grid-template-columns:minmax(0,1fr) 3mm 34mm;align-items:end}
.sg .ln{margin-top:5mm;font-weight:600;font-size:9.6pt}
.sg .ln span{border-bottom:1px solid var(--ink);height:1.2em}
.sg .ln i{font-style:normal;text-align:center;color:var(--mut)}
.sg .ln em{font-style:normal;border-bottom:1px solid var(--ink);padding:0 .5mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg .h{font-size:6.6pt;color:var(--mut);margin-top:.6mm;letter-spacing:.02em}
.sg .h :last-child{grid-column:3}
.legal{margin-top:3.6mm;padding-top:2mm;border-top:1px solid var(--hair);font-size:7.2pt;line-height:1.4;color:var(--mut)}
.foot{display:flex;justify-content:space-between;gap:4mm;margin-top:2.2mm;font-size:6.8pt;color:#A29C90;letter-spacing:.03em}
.ph{display:flex;align-items:center;gap:4mm;padding-bottom:3mm;border-bottom:1.5px solid var(--ink)}

.ph .s{color:var(--mut);font-size:8.6pt;margin-top:.6mm}
.sheet table{width:100%;border-collapse:collapse}
.sheet th{font-size:7.2pt;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tan);text-align:left;padding:1.2mm 2mm 1.2mm 0;border-bottom:1px solid var(--ink)}
.sheet td{padding:1.5mm 2mm 1.5mm 0;border-bottom:1px solid var(--hair);vertical-align:top}
.sheet .num{font-family:inherit;text-align:right;font-weight:600;padding-right:0}
.sheet .warn{margin-top:4mm;font-size:8.4pt;color:#B3261E}
@media print{
  @page{size:A4;margin:0}
  html,body{height:auto;overflow:visible;background:#fff}

  .sheetwrap:last-child .sheet{page-break-after:auto}
}

<script>
(function () {
  'use strict';
  var C = window.SPCore;
  var KEY = 'hh-siteplan-v3:current', KEY2 = 'hh-siteplan:current';
  var STEPS = [
    { id: 'parcel', t: 'Участок', s: 'Граница участка и подписи сторон' },
    { id: 'house', t: 'Дом', s: 'Контур дома и его место на участке' },
    { id: 'anchors', t: 'Привязки', s: 'Три точки дома к двум границам' },
    { id: 'slope', t: 'Уклон', s: 'Отметки углов дома — нивелир или лазер' },
    { id: 'objects', t: 'Объекты', s: 'Въезд, плиты, вода, свет, деревья' },
    { id: 'act', t: 'Акт', s: 'Проверка, данные и печать' }
  ];
  var SIDE_TAGS = ['дорога', 'улица', 'проезд', 'соседний участок', 'лес / поле'];
  var QUICK = ['entry', 'slabs', 'gate', 'well', 'septic', 'pole', 'panel', 'tree', 'ditch', 'cabin', 'fence', 'label'];
  var UTIL = [['sewer', 'Канализация', 'колодец / септик'], ['water', 'Водоснабжение', 'колодец / скважина'], ['power', 'Электричество', 'столб ЛЭП, щит'], ['drain', 'Канава', 'для ливневых и дренажных вод']];

  var $ = function (id) { return document.getElementById(id); };
  var esc = C.esc, fmt = C.fmt, num = C.num;
  var cv = $('cv'), stage = $('stage'), panel = $('panel');

  var doc = null;
  var st = {
    step: 'parcel', sel: null, pickV: null, pickS: null, place: null, V: null,
    hist: [], fut: [], savedAt: null, saveErr: false, pop: null, toastT: 0, more: {},
    rectW: '30', rectD: '40', hShape: 'rect', hW: '12', hL: '10', hA: '6', hC: '4', catalog: false, v2: false
  };

  /* ---------- данные ---------- */
  function snapshot() { return JSON.stringify(doc); }
  function persist() {
    try { doc.updatedAt = new Date().toISOString(); localStorage.setItem(KEY, snapshot()); st.savedAt = new Date(); st.saveErr = false; }
    catch (e) { st.saveErr = true; }
    renderTop();
  }
  var saveT = 0;
  function persistSoon() { clearTimeout(saveT); saveT = setTimeout(persist, 350); }
  function commit(fn, keepPanel) {
    var before = snapshot();
    fn();
    if (snapshot() === before) { render(); return; }
    st.hist.push(before); if (st.hist.length > 80) st.hist.shift(); st.fut = [];
    persist();
    if (keepPanel) { paint(); renderSteps(); renderTop(); } else render();
  }
  function setDoc(d, msg) {
    var prev = doc ? snapshot() : null; /* прежний проект можно вернуть кнопкой «Отменить» */
    st.draw = null;
    doc = d; st.sel = null; st.pickV = st.pickS = st.place = null; st.pop = null; st.V = null; st.hist = prev ? [prev] : []; st.fut = [];
    persist(); fit(); render(); if (msg) toast(msg);
  }
  function undo() { if (!st.hist.length) return; st.fut.push(snapshot()); doc = JSON.parse(st.hist.pop()); afterHist('Отменено'); }
  function redo() { if (!st.fut.length) return; st.hist.push(snapshot()); doc = JSON.parse(st.fut.pop()); afterHist('Возвращено'); }
  function afterHist(m) { st.sel = null; st.pickV = st.pickS = null; st.pop = null; persist(); render(); toast(m); }

  function B() { return doc.building; }
  function closed() { return doc.parcel.closed && doc.parcel.verts.length >= 3; }
  function segList() { return closed() ? C.segs(doc.parcel) : []; }
  function segByKey(k) { var s = segList(); for (var i = 0; i < s.length; i++) if (s[i].key === k) return s[i]; return null; }
  function sideName(s) { return 'сторона ' + s.n + (s.label ? ' (' + s.label + ')' : ''); }
  function letter(vid) { return doc.building ? C.letterOf(doc.building, vid) : '?'; }
  function anchorById(id) { for (var i = 0; i < doc.anchors.length; i++) if (doc.anchors[i].id === id) return doc.anchors[i]; return null; }
  function objById(id) { for (var i = 0; i < doc.objects.length; i++) if (doc.objects[i].id === id) return doc.objects[i]; return null; }
  function r2(v) { return Math.round(v * 100) / 100; }
  function centroid() { var v = doc.parcel.verts, x = 0, y = 0; v.forEach(function (p) { x += p.x; y += p.y; }); return v.length ? { x: x / v.length, y: y / v.length } : { x: 0, y: 0 }; }
  function segAngle(s) { return Math.atan2(s.b.y - s.a.y, s.b.x - s.a.x) * 180 / Math.PI; }
  function normA(a) { while (a > 180) a -= 360; while (a <= -180) a += 360; return a; }

  /* статус шагов */
  function status() {
    var ch = C.checks(doc), bad = {}, E = doc.building ? C.elevInfo(doc) : null;
    ch.forEach(function (c) { if (c.lvl === 'err') bad[c.step] = 1; });
    var tie = Object.keys(C.tiePoints(doc)).length;
    return {
      checks: ch,
      parcel: closed() ? (bad.parcel ? 'bad' : 'done') : '',
      house: doc.building ? (bad.house ? 'bad' : 'done') : '',
      anchors: doc.building && closed() ? (bad.anchors ? (doc.anchors.length ? 'bad' : '') : 'done') : '',
      slope: E && E.n >= 2 ? 'done' : (String(doc.meta.slopeMm || '').trim() ? 'done' : ''),
      objects: doc.objects.length ? 'done' : '',
      act: !ch.some(function (c) { return c.lvl === 'err'; }) && String(doc.meta.customer || '').trim() && String(doc.meta.address || '').trim() ? 'done' : '',
      tie: tie
    };
  }

  /* ---------- вид ---------- */
  function size() { var r = stage.getBoundingClientRect(); return { W: Math.max(200, Math.round(r.width)), H: Math.max(160, Math.round(r.height)) }; }
  function fit() {
    if (!doc) return; var z = size(), pad = Math.max(44, Math.min(90, z.W * 0.09));
    if (isM() && SH.full) { /* лист закрывает низ экрана — центрируем схему в открытой части */
      var cover = Math.min(SH.full - SH.D[SH.det], SH.full - SH.D.half), Hv = Math.max(160, z.H - cover), V = C.fitView(doc, z.W, Hv, Math.max(30, Math.min(56, z.W * 0.08)));
      V.H = z.H; V.cy = V.cy - (z.H - Hv) / (2 * V.k); st.V = V; return;
    }
    st.V = C.fitView(doc, z.W, z.H, pad);
  }
  function zoomAt(f, sx, sy) {
    var V = st.V; if (!V) return;
    var wx = (sx - V.W / 2) / V.k + V.cx, wy = V.cy - (sy - V.H / 2) / V.k;
    V.k = Math.max(0.5, Math.min(400, V.k * f));
    V.cx = wx - (sx - V.W / 2) / V.k; V.cy = wy + (sy - V.H / 2) / V.k;
    paint();
  }
  function uiFor() {
    var s = st.step, ui = { step: s, tool: 'select', sel: st.sel, pickV: st.pickV, pickS: st.pickS };
    if (s === 'anchors') ui.tool = 'anchorS';
    if (s === 'house' && st.pop && st.pop.type === 'wall') ui.sel = { k: 'wall', i: st.pop.i };
    if (s === 'house' && doc.building && !st.sel && !st.pop) ui.sel = { k: 'house' };
    if (s === 'slope' && st.pop && st.pop.type === 'elev') ui.sel = { k: 'corner', id: st.pop.vid };
    if (s === 'anchors' && st.pop && st.pop.type === 'anchor') ui.sel = { k: 'an', id: st.pop.id };
    return ui;
  }
  var raf = 0;
  function paint() {
    if (!doc) return;
    var z = size(); if (!st.V) fit(); st.V.W = z.W; st.V.H = z.H;
    cv.innerHTML = C.drawScene(doc, st.V, uiFor()) + (drawOn() ? dwSvg() : '');
    renderBadges(); renderHint();
