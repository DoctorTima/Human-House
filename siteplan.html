        e.target.tagName, String(e.target.src || e.target.href || ''));

    let template = JSON.parse(templateEl.textContent);

    // document mints the blobs for its OWN frames, obtaining page text

    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

          mountPage(el, m[2] || '', text);

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // does XHR against the src, but blob:null/ from a file:// origin is

      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

    console.error('Bundle unpack error:', err);

bel }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ pmDraw }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0;font-size:14px;line-height:1.5;color:#B4AFA3;text-wrap:pretty\">Касайтесь вершин участка по порядку — между ними будут прямые стороны. Замкните контур касанием первой точки. Точные длины и координаты задайте ниже.<\u002Fp>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <button sc-camel-on-click=\"{{ startDraw }}\" style=\"min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #BF512D;background:#BF512D;color:#fff;font:700 14px 'Golos Text',sans-serif;cursor:pointer\" style-hover=\"background:#A9441F\">{{ drawLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n              <label style=\"display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ ortho }}\" sc-camel-on-change=\"{{ toggleOrtho }}\" style=\"width:20px;height:20px;accent-color:#BF512D\">Только горизонтальные и вертикальные стороны<\u002Flabel>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ pmTrace }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0;font-size:14px;line-height:1.5;color:#B4AFA3;text-wrap:pretty\">Загрузите план или спутниковый снимок (JPG, PNG), откалибруйте масштаб по двум точкам и обведите границу в режиме «Нарисовать».<\u002Fp>\n              <button sc-camel-on-click=\"{{ pickUl }}\" style=\"min-height:44px;border-radius:8px;border:1px solid #3A372F;background:#1F1E19;color:#F5F2E9;font:600 14px 'Golos Text',sans-serif;cursor:pointer\" style-hover=\"background:#2A2822\">{{ ulLabel }}<\u002Fbutton>\n              <sc-if value=\"{{ hasUl }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid #302E27;border-radius:12px;background:#16150F\">\n                  <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:600;color:#B4AFA3\">Прозрачность подложки · {{ ulOpText }}<\u002Fspan><input type=\"range\" min=\"0.1\" max=\"1\" step=\"0.05\" value=\"{{ ulOp }}\" sc-camel-on-change=\"{{ onUlOp }}\" style=\"width:100%;accent-color:#BF512D;height:32px\"><\u002Flabel>\n                  <label style=\"display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ ulLocked }}\" sc-camel-on-change=\"{{ toggleUlLock }}\" style=\"width:20px;height:20px;accent-color:#BF512D\">Заблокировать подложку<\u002Flabel>\n                  <div style=\"font-size:13px;color:#B4AFA3\">{{ ulScaleText }}<\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ startCalib }}\" style=\"min-height:44px;border-radius:8px;border:1px solid #3A372F;background:#1F1E19;color:#F5F2E9;font:600 14px 'Golos Text',sans-serif;cursor:pointer\" style-hover=\"background:#2A2822\">Масштаб по двум точкам<\u002Fbutton>\n                  <sc-if value=\"{{ calibReady }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;gap:8px;align-items:flex-end\">\n                      <label style=\"flex:1;display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:600;color:#B4AFA3\">Расстояние между точками 1–2, м<\u002Fspan><input type=\"text\" sc-camel-input-mode=\"decimal\" data-f=\"calibDist\" value=\"{{ calibDist }}\" sc-camel-on-change=\"{{ onLocal }}\" style=\"width:100%;box-sizing:border-box;height:44px;padding:0 12px;border-radius:8px;border:1px solid #3A372F;background:#12110E;color:#F5F2E9;font:500 15px 'Golos Text',sans-serif;outline:none\" style-focus=\"border-color:#BF512D\"><\u002Flabel>\n                      <button sc-camel-on-click=\"{{ applyCalib }}\" style=\"min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #BF512D;background:#BF512D;color:#fff;font:700 14px 'Golos Text',sans-serif;cursor:pointer\">Применить<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#D9B48F\">Фото бумажного листа под углом искажено перспективой — после калибровки оно остаётся справочным. Точные размеры вводите числами.<\u002Fp>\n                  <button sc-camel-on-click=\"{{ removeUl }}\" style=\"min-height:40px;border-radius:8px;border:1px solid #3A372F;background:transparent;color:#F0A58C;font:600 13px 'Golos Text',sans-serif;cursor:pointer\">Удалить подложку<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid #302E27;border-radius:12px;background:#16150F\">\n              <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:baseline\"><span style=\"font-size:13px;color:#B4AFA3\">Площадь<\u002Fspan><span style=\"font-weight:700;font-size:17px;font-variant-numeric:tabular-nums\">{{ areaText }}<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:13px;color:{{ pStatusColor }}\">{{ pStatus }}<\u002Fdiv>\n              <label style=\"display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px;cursor:pointer\"><input type=\"checkbox\" data-k=\"parcel.approx\" checked=\"{{ approx }}\" sc-camel-on-change=\"{{ onText }}\" style=\"width:20px;height:20px;accent-color:#BF512D\">Граница задана схематично<\u002Flabel>\n            <\u002Fdiv>\n            <sc-for list=\"{{ parcelErrors }}\" as=\"e\" hint-placeholder-count=\"0\">\n              <div style=\"padding:10px 12px;border-radius:10px;border:1px solid #6B2A1C;background:#2A1510;color:#F3C7B8;font-size:13.5px;line-height:1.45\">{{ e.text }}<\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ hasSegs }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <div style=\"font-size:13px;font-weight:700\">Стороны участка<\u002Fdiv>\n                <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#B4AFA3;text-wrap:pretty\">При изменении длины начальная вершина стороны остаётся на месте, конечная сдвигается вдоль стороны — соседняя сторона изменит длину и направление. Одни длины сторон не задают форму участка: для точной формы используйте координаты вершин.<\u002Fp>\n                <sc-for list=\"{{ segRows }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div data-id=\"{{ s.key }}\" style=\"display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.3fr);gap:8px;align-items:center;padding:6px;border-radius:10px;background:{{ s.bg }}\">\n                    <button data-key=\"{{ s.key }}\" sc-camel-on-click=\"{{ selSeg }}\" style=\"width:44px;height:44px;border-radius:8px;border:1px solid #3A372F;background:#12110E;color:#F5F2E9;font:700 13px 'Golos Text',sans-serif;cursor:pointer\" aria-label=\"{{ s.aria }}\">{{ s.n }}<\u002Fbutton>\n                    <input type=\"text\" sc-camel-input-mode=\"decimal\" aria-label=\"{{ s.lenAria }}\" data-k=\"{{ s.lk }}\" data-min=\"0.01\" data-max=\"5000\" value=\"{{ s.lv }}\" sc-camel-on-change=\"{{ onNumIn }}\" sc-camel-on-blur=\"{{ onNumGo }}\" sc-camel-on-key-down=\"{{ onEnter }}\" style=\"width:100%;box-sizing:border-box;height:44px;padding:0 10px;border-radius:8px;border:1px solid #3A372F;background:#12110E;color:#F5F2E9;font:500 15px 'Golos Text',sans-serif;outline:none\" style-focus=\"border-color:#BF512D\">\n                    <input type=\"text\" list=\"hh-side-labels\" placeholder=\"подпись стороны\" aria-label=\"Подпись стороны\" data-k=\"{{ s.labk }}\" value=\"{{ s.label }}\" sc-camel-on-change=\"{{ onText }}\" style=\"width:100%;box-sizing:border-box;height:44px;padding:0 10px;border-radius:8px;border:1px solid #3A372F;background:#12110E;color:#F5F2E9;font:500 14px 'Golos Text',sans-serif;outline:none\" style-focus=\"border-colo er-color:#BF512D\">\n                      <button data-id=\"{{ v.id }}\" sc-camel-on-click=\"{{ delVert }}\" aria-label=\"Удалить вершину\" style=\"width:44px;height:44px;border-radius:8px;border:1px solid #3A372F;background:transparent;color:#F0A58C;font:600 16px 'Golos Text',sans-serif;cursor:pointer\">×<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <span style=\"font-size:12px;color:#8E897D\">Ось X — вправо, ось Y — вверх (условный север схемы).<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdetails>\n            <\u002Fsc-if>\n            <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:600;color:#B4AFA3\">Кадастровый номер (необязательно)<\u002Fspan><input type=\"text\" data-k=\"meta.cadastral\" value=\"{{ cadastral }}\" sc-camel-on-change=\"{{ onText }}\" placeholder=\"00:00:0000000:000\" style=\"width:100%;box-sizing:border-box;height:44px;padding:0 12px;border-radius:8px;border:1px solid #3A372F;background:#12110E;color:#F5F2E9;font:500 15px 'Golos Text',sans-serif;outline:none\" style-focus=\"border-color:#BF512D\"><\u002Flabel>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ isHouse }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-if value=\"{{ noHouse }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0;font-size:14px;line-height:1.5;color:#B4AFA3\">Выберите тип наружного контура. Размеры и положение уточните числами.<\u002Fp>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px\">\n                <button data-v=\"rect\" sc-camel-on-click=\"{{ addHouse }}\" style=\"min-height:72px;border-radius:12px;border:1px solid #3A372F;background:#1F1E19;color:#F5F2E9;font:600 14px 'Golos Text',sans-serif;cursor:pointer\" style-hover=\"border-color:#BF512D\">Прямоугольник<\u002Fbutton>\n                <button data-v=\"L\" sc-camel-on-click=\"{{ add peat(2,minmax(0,1fr));gap:10px\">\n                <sc-for list=\"{{ houseFields }}\" as=\"f\" hint-placeholder-count=\"2\">\n                  <label style=\"display:flex;flex-direction:column;gap:6px;min-width:0\"><span style=\"font-size:12px;font-weight:600;color:#B4AFA3\">{{ f.label }}<\u002Fspan><input type=\"text\" sc-camel-input-mode=\"decimal\" data-k=\"{{ f.k }}\" data-min=\"{{ f.min }}\" data-max=\"{{ f.max }}\" value=\"{{ f.val }}\" sc-camel-on-change=\"{{ onNumIn }}\" sc-camel-on-blur=\"{{ onNumGo }}\" sc-camel-on-key-down=\"{{ onEnter }}\" style=\"width:100%;box-sizing:border-box;height:44px;padding:0 12px;border-radius:8px;border:1px solid #3A372F;background:#12110E;color:#F5F2E9;font:500 15px 'Golos Text',sans-serif;outline:none\" style-focus=\"border-color:#BF512D\"><\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ isL }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <span style=\"font-size:12px;font-weight:600;color:#B4AFA3\">Угол выреза<\u002Fspan>\n                  <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px\">\n                    <sc-for list=\"{{ cornerOpts }}\" as=\"m\" hint-placeholder-count=\"4\">\n                      <button data-v=\"{{ m.id }}\" sc-camel-on-click=\"{{ setCorner }}\" style=\"min-height:40px;border-radius:8px;border:1px solid {{ m.bd }};background:{{ m.bg }};color:{{ m.fg }};font:600 12px 'Golos Text',sans-serif;cursor:pointer\">{{ m.t }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ isPoly }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid #302E27;border-radius:12px;background:#16150F\">\n                  <div style=\"font-size:13px;font-weight:700\">Стены по порядку<\u002Fdiv>\n                  <p style=\"margin:0;font-size:12.5px;line-height:1.5;color:#B4AFA3;text-wrap:pretty\">Обходите дом по часовой стрелке от верхнего левого угла. Для каждой стены — длина и поворот в её конце: наружный угол — направо, внутренний — налево. Последняя стена достраивается сама. Номера стен видны на схеме.<\u002Fp>\n                  <div style=\"display:grid;grid-template-columns:40px minmax(0,1fr) 44px;gap:6px;font-size:11.5px;color:#8E897D\"><span>№<\u002Fspan><span>длина, м · затем поворот<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n                  <sc-for list=\"{{ wallRows }}\" as=\"w\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;border:1px solid {{ w.bd }};background:#12110E\">\n                      <div style=\"display:grid;grid-template-columns:40px minmax(0,1fr) 44px;gap:6px;align-items:center\">\n                        <button data-i=\"{{ w.i }}\" sc-camel-on-click=\"{{ selWall }}\" aria-label=\"Выбрать стену\" style=\"width:40px;height:40px;border-radius:999px;border:1px solid {{ w.nbd }};background:{{ w.nbg }};color:#F5F2E9;font:700 13px 'Golos Text',sans-serif;cursor:pointer\">{{ w.n }}<\u002Fbutton>\n                        <input type=\"text\" sc-camel-input-mode=\"decimal\" aria-label=\"Длина стены, м\" data-k=\"{{ w.lk }}\" data-min=\"0.05\" data-max=\"300\" value=\"{{ w.lv }}\" sc-camel-on-change=\"{{ onNumIn }}\" sc-camel-on-blur=\"{{ onNumGo }}\" sc-camel-on-key-down=\"{{ onEnter }}\" style=\"width:100%;box-sizing:border-box;height:44px;padding:0 10px;border-radius:8px;border:1px solid #3A372F;background:#1B1A15;color:#F5F2E9;font:500 15px 'Golos Text',sans-serif;outline:none\" style-focus=\"border-color:#BF512D\">\n                        <button data-i=\"{{ w.i }}\" sc-camel-on-click=\"{{ delWall }}\" aria-label=\"Удалить стену\" style=\"width:44px;height:44px;border-radius:8px;border:1px solid #3A372F;background:transparent;color:#F0A58C;font:600 16px 'Golos Text',sans-serif;cursor:pointer\">×<\u002Fbutton>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ w.hasTurn }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 64px;gap:6px;align-items:center\">\n                          <button data-i=\"{{ w.i }}\" data-dir=\"r\" sc-camel-on-click=\"{{ setTurn }}\" style=\"height:40px;border-radius:8px;border:1px solid #3A372F;background:{{ w.rbg }};color:{{ w.rfg }};font:600 12.5px 'Golos Text',sans-serif;cursor:pointer\">направо<\u002Fbutton>\n                          <button data-i=\"{{ w.i }}\" data-dir=\"l\" sc-camel-on-click=\"{{ setTurn }}\" style=\"height:40px;border-radius:8px;border:1px solid #3A372F;background:{{ w.lbg }};color:{{ w.lfg }};font:600 12.5px 'Golos Text',sans-serif;cursor:pointer\">налево<\u002Fbutton>\n                          <input type=\"text\" sc-camel-input-mode=\"decimal\" aria-label=\"Угол поворота, градусы\" title=\"Угол поворота, °\" data-k=\"{{ w.ak }}\" data-min=\"1\" data-max=\"179\" value=\"{{ w.av }}\" sc-camel-on-change=\"{{ onNumIn }}\" sc-camel-on-blur=\"{{ onNumGo }}\" sc-camel-on-key-down=\"{{ onEnter }}\" style=\"width:100%;box-sizing:border-box;height:40px;padding:0 10px;border-radius:8px;border:1px solid #3A372F;background:#1B1A15;color:#F5F2E9;font:500 15px 'Golos Text',sans-serif;outline:none\" style-focus=\"border-color:#BF512D\">\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div style=\"padding:10px 12px;border-radius:10px;border:1px dashed #4A463C;font-size:13px;color:#D8D3C6;line-height:1.45\">{{ closeText }}<\u002Fdiv>\n                  <sc-if value=\"{{ closeWarn }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:10px 12px;border-radius:10px;border:1px sol %;height:44px;padding:0 8px;border-radius:8px;border:1px solid #3A372F;background:#12110E;color:#F5F2E9;font:500 14px 'Golos Text',sans-serif\">\n                      <option value=\"\">не указано<\u002Foption><option value=\"yes\">есть<\u002Foption><option value=\"planned\">планируется<\u002Foption><option value=\"no\">нет<\u002Foption>\n                    <\u002Fsc-raw-select>\n                    <input type=\"text\" placeholder=\"комментарий\" aria-label=\"Комментарий\" data-k=\"{{ u.ck }}\" value=\"{{ u.cv }}\" sc-camel-on-change=\"{{ onText }}\" style=\"width:100%;box-sizing:border-box;height:44px;padding:0 10px;border-radius:8px;border:1px solid #3A372F;background:#12110E;color:#F5F2E9;font:500 14px 'Golos Text',sans-serif;outline:none\" style-focus=\"border-color:#BF512D\">\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ u.isWater }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\n                      <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:600;color:#B4AFA3\">Высота лотка от земли, мм<\u002Fspan><input type=\"text\" sc-camel-input-mode=\"decimal\" data-k=\"util.water.hatch\" value=\"{{ u.hatch }}\" sc-camel-on-change=\"{{ onText }}\" style=\"width:100%;box-sizing:border-box;height:44px;padding:0 10px;border-radius:8px;border:1px solid #3A372F;background:#12110E;color:#F5F2E9;font:500 14px 'Golos Text',sans-serif;outline:none\" style-focus=\"border-color:#BF512D\"><\u002Flabel>\n                      <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:600;color:#B4AFA3\">Высота трубы от земли, мм<\u002Fspan><input type=\"text\" sc-camel-input-mode=\"decimal\" data-k=\"util.water.pipe\" value=\"{{ u.pipe }}\" sc-camel-on-change=\"{{ onText }}\" style=\"width:100%;box-sizing:border-box;height:44px;padding:0 10px;border-radius:8px;border:1px solid #3A372F;background:#12110E;color:#F5F2E9;font:500 14px 'Golos Text',sans-serif;outline:none\" style-focus=\"border-color:#BF512D\"><\u002Flabel>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-size:12px;font-weight:600;color:#B4AFA3\">Примечания<\u002Fspan><textarea data-k=\"meta.notes\" sc-camel-on-change=\"{{ onText }}\" value=\"{{ notes }}\" rows=\"3\" style=\"width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid #3A372F;background:#12110E;color:#F5F2E9;font:500 14px 'Golos Text',sans-serif;outline:none;resize:vertical\" style-focus=\"border-color:#BF512D\"><\u002Ftextarea><\u002Flabel>\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <label style=\"display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ split }}\" sc-camel-on-change=\"{{ toggleSplit }}\" style=\"width:20px;height:20px;accent-color:#BF512D\">Схема на отдельном листе (2 страницы)<\u002Flabel>\n              <label style=\"display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ noPersonal }}\" sc-camel-on-change=\"{{ toggleNoPersonal }}\" style=\"width:20px;height:20px;accent-color:#BF512D\">Не сохранять ФИО и адрес на устройстве<\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\n              <button sc-camel-on-click=\"{{ openPreview }}\" style=\"min-height:48px;border-radius:8px;border:1px solid #BF512D;background:#BF512D;color:#fff;font:700 14px 'Golos Text',sans-serif;cursor:pointer\" style-hover=\"background:#A9441F\">Предпросмотр акта<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ saveFile }}\" style=\"min-height:48px;border-radius:8px;border:1px solid #3A372F;background:#1F1E19;color:#F5F2E9;font:600 13px 'Golos Text',sans-serif;cursor:pointer;line-height:1.2\" style-hover=\"background:#2A2822\">Сохранить файл проекта<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Faside>\n\n      <sc-if value=\"{{ confirmClear }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;inset:0;z-index:30;background:rgba(16,15,12,.72);display:flex;align-items:center;justify-content:center;padding:20px\">\n          <div role=\"dialog\" aria-modal=\"true\" style=\"max-width:420px;width:100%;background:#1B1A15;border:1px solid #302E27;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-weight:800;font-size:19px\">Очистить данные на этом устройстве?<\u002Fdiv>\n            <p style=\"margin:0;font-size:14px;line-height:1.5;color:#B4AFA3\">Текущий проект будет удалён из памяти браузера. Это нельзя отменить — сначала сохраните файл проекта, если он нужен.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\n              <button sc-camel-on-click=\"{{ cancelClear }}\" style=\"min-height:44px;border-radius:8px;border:1px solid #3A372F;background:#1F1E19;color:#F5F2E9;font:600 14px 'Golos Text',sans-serif;cursor:pointer\">Отмена<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ doClear }}\" style=\"min-height:44px;border-radius:8px;border:1px solid #9A3A22;background:#7E2E1A;color:#fff;font:700 14px 'Golos Text',sans-serif;cursor:pointer\">Очистить<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ isPhone }}\" hint-placeholder-val=\"{{ false }}\">\n      <nav style=\"flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid #302E27;background:#100F0C;padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:12\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <button data-step=\"{{ s.id }}\" sc-camel-on-click=\"{{ goStep }}\" style=\"min-height:60px;border:none;background:none;color:{{ s.pf }};font:600 11px 'Golos Text',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px 2px\">\n            <span style=\"width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:{{ s.nb }};color:{{ s.nf }}\">{{ s.mark }}<\u002Fspan>{{ s.t }}\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fnav>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showPreview }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-noprint=\"1\" style=\"position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:#100F0C;border-bottom:1px solid #302E27\">\n      <button sc-camel-on-click=\"{{ closePreview }}\" style=\"min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #3A372F;background:#1F1E19;color:#F5F2E9;font:600 14px 'Golos Text',sans-serif;cursor:pointer\">← К редактору<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ doPrint }}\" style=\"min-height:44px;padding:0 14px;border-radius:8px;border:1px solid #BF512D;background:#BF512D;color:#fff;font:700 14px 'Golos Text',sans-serif;cursor:pointer\" style-hover=\"background:#A9441F\">Печать / сохранить PDF<\u002Fbutton>\n      <span style=\"font-size:12.5px;color:#B4AFA3;flex:1 1 220px\">Откроется диалог печати браузера — выберите принтер или «Сохранить как PDF», формат A4.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-screen-label=\"Акт\" style=\"padding:20px 12px 40px;display:flex;flex-direction:column;align-items:center;gap:20px\">\n      <div data-a4=\"1\" style=\"width:100%;max-width:210mm;box-sizing:border-box;background:#fff;color:#1D1C18;padding:12mm;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.4);font-family:'Golos Text',Arial,sans-serif;font-size:10.5pt;line-height:1.4\">\n        <div style=\"display:flex;align-items:center;gap:12px;border-bottom:1.5px solid #1D1C18;padding-bottom:8px;margin-bottom:8px\">\n          <img src=\"6a6fa048-ee52-45d0-9759-684b6e494763\" alt=\"Human House\" style=\"width:44px;height:44px;object-fit:contain;filter:invert(1)\">\n          <div style=\"flex:1\">\n            <div style=\"font-weight:800;font-size:13pt;letter-spacing:.02em\">АКТ определения пятна застройки<\u002Fdiv>\n            <div style=\"font-size:9.5pt;color:#4A473F\">№ {{ prActNo }} от {{ prActDate }} · ред. {{ prRev }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ isDraft }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"border:2px solid #9A3A22;color:#9A3A22;font-weight:800;font-size:11pt;padding:4px 10px;letter-spacing:.12em;transform:rotate(-4deg)\">ЧЕРНОВИК<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"font-size:8.5pt;color:#6B675C;margin-bottom:8px\">Шаблон требует проверки Human House: состав полей восстановлен по фотографии действующего акта.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);border-top:1px solid #C9C4B8\">\n          <sc-for list=\"{{ prRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"padding:4px 8px 4px 0;border-bottom:1px solid #E2DED4;color:#4A473F;font-size:9.5pt\">{{ r.l }}<\u002Fdiv>\n            <div style=\"padding:4px 0;border-bottom:1px solid #E2DED4;font-weight:500\">{{ r.v }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:8px;font-size:9.5pt;font-weight:700\">На схеме указаны места расположения (привязка):<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <sc-for list=\"{{ prUtil }}\" as=\"u\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:3px 0;border-bottom:1px solid #E2DED4;font-size:9.5pt\"><span>{{ u.l }}<\u002Fspan><span style=\"font-weight:600;text-align:right\">{{ u.v }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"margin-top:6px;font-size:9pt;color:#4A473F\">Пятно застройки дома привязать минимум в двух точках к двум границам участка (3–4 размера). Границы участка указываются заказчиком.<\u002Fdiv>\n        <sc-if value=\"{{ schemeOnP1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div data-keep=\"1\" style=\"margin-top:8px;border:1px solid #C9C4B8;padding:4px\">\n            <div ref=\"{{ prSchemeRef }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div data-keep=\"1\" style=\"margin-top:6px\" ref=\"{{ prLegendRef }}\"><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ schemeOnP1 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div data-keep=\"1\" style=\"margin-top:6px;font-size:9pt\">\n            <div style=\"font-weight:700;margin-bottom:2px\">Привязки (по перпендикуляру к стороне участка), м<\u002Fdiv>\n            <sc-for list=\"{{ prAnchors }}\" as=\"a\" hint-placeholder-count=\"3\"><div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-bottom:1px solid #E2DED4;padding:2px 0\"><span>{{ a.t }}<\u002Fspan><span style=\"font-weight:700\">{{ a.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <div style=\"color:#6B675C;margin-top:3px\">{{ prScaleNote }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ prNotes }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:6px;font-size:9.5pt\"><b>Примечания:<\u002Fb> {{ prNotes }}<\u002Fdiv><\u002Fsc-if>\n        <sc-if value=\"{{ isDraft }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:6px;font-size:8.5pt;color:#7E2E1A;border:1px dashed #C08A78;padding:4px 6px\"><b>Черновик — неуточнённые данные:<\u002Fb> {{ draftIssues }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <div data-keep=\"1\" style=\"margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;font-size:9.5pt\">\n          <div><div style=\"border-bottom:1px solid #1D1C18;height:26px\"><\u002Fdiv><div style=\"margin-top:3px\">Инженер технического надзора · {{ prEngineer }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"border-bottom:1px solid #1D1C18;height:26px\"><\u002Fdiv><div style=\"margin-top:3px\">Заказчик (или правомочный представитель заказчика)<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:7.5pt;color:#4A473F;line-height:1.35\">Подписанием настоящего Акта Заказчик подтверждает, что ознакомлен с требованиями законодательства РФ о соблюдении нормативных и противопожарных расстояний от границ земельного участка до зданий, строений и/или сооружений (жилой дом, баня, гараж, хозяйственная постройка и т. д.), деревьев/кустарников, а также между ними и несёт полную ответственность за нарушение данных требований. <i>(Текст перенесён с фотографии акта — сверить с утверждённым бланком.)<\u002Fi><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ split }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-a4=\"1\" style=\"width:100%;max-width:210mm;box-sizing:border-box;background:#fff;color:#1D1C18;padding:12mm;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.4);font-family:'Golos Text',Arial,sans-serif;font-size:10.5pt\">\n          <div style=\"display:flex;justify-content:space-between;gap:10px;border-bottom:1.5px solid #1D1C18;padding-bottom:6px;margin-bottom:8px;font-size:9.5pt\"><b>Схема определения пятна застройки · лист 2<\u002Fb><span>Акт № {{ prActNo }} · ред. {{ prRev }}<\u002Fspan><\u002Fdiv>\n          <div style=\"border:1px solid #C9C4B8;padding:4px\"><div ref=\"{{ prSchemeRef }}\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"margin-top:6px\" ref=\"{{ prLegendRef }}\"><\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:9pt\">\n            <div style=\"font-weight:700;margin-bottom:2px\">Привязки (по перпендикуляру к стороне участка), м<\u002Fdiv>\n            <sc-for list=\"{{ prAnchors }}\" as=\"a\" hint-placeholder-count=\"3\"><div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-bottom:1px solid #E2DED4;padding:2px 0\"><span>{{ a.t }}<\u002Fspan><span style=\"font-weight:700\">{{ a.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n            <div style=\"color:#6B675C;margin-top:3px\">{{ prScaleNote }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-noprint=\"1\" role=\"status\" style=\"position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;max-width:min(92vw,520px);padding:12px 16px;border-radius:12px;background:#F5F2E9;color:#1B1A15;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.4);line-height:1.4\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst KEY = 'hh-siteplan:current', PREF = 'hh-siteplan:prefs';\nconst R = v => Math.round(v * 100) / 100;\nconst fin = v => { const s = String(Math.round(v * 100) / 100).replace('.', ','); return s === '-0' ? '0' : s; };\nconst STEPS = [{ id: 'parcel', t: 'Участок', s: 'Граница и стороны' }, { id: 'house', t: 'Дом', s: 'Наружный контур и положение' }, { id: 'anchors', t: 'Привязки', s: 'Три основных размера' }, { id: 'objects', t: 'Объекты', s: 'Коммуникации и окружение' }, { id: 'act', t: 'Акт', s: 'Данные, проверка, печать' }];\n\nclass Component extends DCLogic {\n  state = { ready: false, doc: null, saved: null, step: 'parcel', sel: null, tool: 'select', td: {}, cam: null, hist: [], fut: [], save: { ok: false, t: 'н
